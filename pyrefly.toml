# pyrefly.toml
# Docs: https://pyrefly.org/en/docs/configuration/

project-includes = ["src", "tests"]

project-excludes = [
    "**/dist/**",
    "**/build/**",
]

search-path = [".", "src"]
use-ignore-files = true
ignore-errors-in-generated-code = true
python-version = "3.12"
untyped-def-behavior = "check-and-infer-return-type"

[errors]
unknown-name = true
unbound-name = true
import-error = true
missing-module-attribute = true
missing-attribute = true
bad-assignment = true
invalid-annotation = true
bad-argument-type = true
bad-return = true
missing-argument = true
bad-argument-count = true
unexpected-keyword = true
unexpected-positional-argument = true
index-error = true
redundant-cast = false
assert-type = true

[[sub-config]]
matches = "**/tests/**"

[sub-config.errors]
missing-attribute = false
import-error = false
bad-assignment = false
bad-argument-type = false
bad-return = false

[[sub-config]]
matches = "**/conftest.py"

[sub-config.errors]
missing-attribute = false
import-error = false
bad-assignment = false
bad-argument-type = false
bad-return = false

[[sub-config]]
matches = "**/test_*.py"

[sub-config.errors]
missing-attribute = false
import-error = false
bad-assignment = false
bad-argument-type = false
bad-return = false

[[sub-config]]
matches = "**/__init__.py"

[sub-config.errors]
import-error = false
missing-module-attribute = false
